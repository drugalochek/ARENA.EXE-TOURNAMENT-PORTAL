<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ONYX</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #121212; --surface: #1e1e1e; --surface-secondary: #2d2d2d; --border: #3a3a3a;
      --text: #e5e7eb; --text-secondary: #9ca3af; --hover: #2c2c2c; --danger: #ff5555;
      --primary-gradient: linear-gradient(135deg, #00c2ff 0%, #00ff95 50%, #ffe600 100%);
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
    }
    body.light { --bg: #f0f2f5; --surface: #ffffff; --surface-secondary: #f7f8fa; --border: #dde1e6; --text: #1a1a1a; --text-secondary: #6b7280; --hover: #f3f4f6; }
    
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #app { width: 100%; max-width: 1200px; height: 95vh; background: var(--surface); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
    #app::before { content: ''; position: absolute; inset: -1px; border-radius: 21px; background: var(--primary-gradient); z-index: -1; opacity: 0.2; pointer-events: none; }

    /* --- Sidebars --- */
    .servers-sidebar { width: 72px; background: var(--surface-secondary); border-right: 1px solid var(--border); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink:0; overflow-y:auto; }
    .server-icon { width: 48px; height: 48px; border-radius: 16px; background: var(--primary-gradient); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: 700; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .server-icon.active { border-radius: 50%; }
    .server-icon.add-server { background: transparent; border: 2px dashed var(--border); color: var(--text-secondary); box-shadow: none; }
    .nav-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: 0.2s; border: 1px solid transparent; }
    .nav-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border); }
    .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-btn.gradient { background: var(--primary-gradient); color: #000; border: none; }
    .nav-btn.gradient:hover { opacity: 0.8; }

    .channels-sidebar { width: 240px; background: var(--surface-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink:0; }
    .server-header { padding: 16px; font-weight: 600; font-size: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition:0.2s; }
    .server-header:hover { background: var(--hover); }
    .channel-group { font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); padding: 16px 16px 6px; display: flex; justify-content: space-between; }
    .channel-item { padding: 8px 16px; margin: 2px 8px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 14px; display: flex; gap: 10px; transition:0.1s; }
    .channel-item:hover, .channel-item.active { background: var(--hover); color: var(--text); }
    
    .friends-sidebar { width: 240px; background: var(--surface-secondary); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; flex-shrink:0; overflow-y:auto; }
    .friends-header { font-weight: 700; font-size: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .friend-item { padding: 8px 10px; border-radius: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition:0.1s; }
    .friend-item:hover { background: var(--hover); }
    .friend-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; }

    /* --- Main Chat --- */
    .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg); height: 100%; min-width: 0; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; background: var(--surface); }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 80%; padding: 8px 14px; border-radius: 12px; align-self: flex-start; background: var(--surface-secondary); color: var(--text); border: 1px solid var(--border); font-size:14px; }
    .message.own { align-self: flex-end; background: var(--primary-gradient); color: #000; border: none; }
    .message .sender { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom:4px; }
    .input-area { display: flex; padding: 12px 20px; border-top: 1px solid var(--border); gap: 10px; background: var(--surface); }
    .input-area input { flex: 1; background: var(--surface-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; color: var(--text); outline: none; font-size:14px; }
    .input-area input:focus { border-color: #00c2ff; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; transition:0.2s; }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .icon-btn.gradient { background: var(--primary-gradient); color: #fff; border: none; }

    /* --- User Panel --- */
    .user-panel { margin-top: auto; padding: 12px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition:0.2s; }
    .user-panel:hover { background: var(--hover); }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-gradient); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
    .user-avatar img { width:100%; height:100%; object-fit:cover; }
    .user-info { flex:1; overflow:hidden; }
    .user-name { font-size: 14px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-tag { font-size: 12px; color: var(--text-secondary); }

    /* --- Login --- */
    .login-wrapper { flex:1; display:flex; align-items:center; justify-content:center; background:var(--surface); }
    .login-box { display:flex; flex-direction:column; gap:16px; background:var(--surface-secondary); padding:32px; border-radius:16px; border:1px solid var(--border); width:340px; max-width:90%; }
    .login-box h2 { text-align:center; margin-bottom:8px; }
    .login-btn { padding:12px; border-radius:10px; border:none; font-weight:600; cursor:pointer; width:100%; transition:0.2s; }
    .login-btn.primary { background:var(--primary-gradient); color:#000; }
    .login-btn.google { background:#fff; color:#333; border:1px solid #ccc; display:flex; justify-content:center; align-items:center; gap:8px; }
    .login-btn.secondary { background:var(--surface); color:var(--text); border:1px solid var(--border); }
    .login-separator { display:flex; align-items:center; gap:8px; color:var(--text-secondary); font-size:12px; margin:4px 0; }
    .login-separator::before, .login-separator::after { content:''; flex:1; height:1px; background:var(--border); }
    .login-input { width:100%; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); outline:none; font-size:14px; }

    /* --- Voice Room --- */
    .voice-container { display: flex; flex: 1; flex-direction: column; height: 100%; background: var(--bg); }
    .voice-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; background: var(--surface); display: flex; align-items: center; gap: 16px; }
    .voice-layout { display: flex; flex: 1; overflow: hidden; }
    .voice-members { width: 200px; background: var(--surface-secondary); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y:auto; flex-shrink:0; }
    .voice-member-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); }
    .voice-member-item .info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
    .voice-member-item .action-btn { padding: 2px 8px; border-radius: 4px; border: none; background: var(--primary-gradient); color: #000; font-size: 12px; cursor: pointer; font-weight:600; }
    .voice-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    
    /* --- Profile --- */
    .profile-view { flex:1; overflow-y:auto; background:var(--bg); display:flex; flex-direction:column; position:relative; }
    .profile-banner { width:100%; height:160px; background:var(--surface-secondary); position:relative; cursor:pointer; overflow:hidden; }
    .profile-banner img { width:100%; height:100%; object-fit:cover; }
    .banner-overlay { position:absolute; right:12px; bottom:12px; background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:6px; color:#fff; font-size:12px; border:none; cursor:pointer; backdrop-filter:blur(4px); }
    .profile-info-area { padding:0 20px 20px; position:relative; margin-top:-48px; display:flex; flex-direction:column; gap:8px; }
    .avatar-wrapper { position:relative; width:96px; height:96px; cursor:pointer; }
    .profile-avatar { width:100%; height:100%; border-radius:50%; background:var(--bg); border:4px solid var(--bg); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; overflow:hidden; color:#fff; }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .avatar-overlay { position:absolute; bottom:4px; right:4px; background:var(--primary-gradient); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); color:#fff; }
    .avatar-overlay svg { width:16px; height:16px; fill:currentColor; }
    .profile-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    .action-btn { padding:6px 16px; border-radius:6px; border:1px solid var(--border); background:var(--surface-secondary); color:var(--text); cursor:pointer; font-size:13px; transition:0.2s; }
    .action-btn:hover { background:var(--hover); }
    .action-btn.primary { background:var(--primary-gradient); color:#000; border:none; }

    /* --- Modals --- */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:9999; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.15s; }
    @keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .modal-box { background:var(--surface); border-radius:16px; padding:24px; min-width:320px; max-width:90%; display:flex; flex-direction:column; gap:16px; border:1px solid var(--border); box-shadow:0 16px 40px rgba(0,0,0,0.6); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:18px; }
    .modal-close { cursor:pointer; font-size:22px; color:var(--text-secondary); }
    .modal-input { width:100%; padding:10px; border-radius:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); outline:none; font-size:14px; }
    .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }

    /* --- Mobile --- */
    @media (max-width: 768px) {
      body { align-items: stretch; background: var(--surface); }
      #app { height: 100vh; border-radius: 0; margin:0; max-width:100%; border:none; }
      #app::before { display: none; }
      .channels-sidebar, .friends-sidebar { position: fixed; top: 0; width: 80%; height: 100vh; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); box-shadow: 2px 0 20px rgba(0,0,0,0.5); border-right: 1px solid var(--border); }
      .channels-sidebar.open { transform: translateX(0); }
      .friends-sidebar { right: 0; left: auto; transform: translateX(100%); border-right: none; border-left: 1px solid var(--border); }
      .friends-sidebar.open { transform: translateX(0); }
      .sidebar-overlay { position: fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; display:none; }
      .sidebar-overlay.active { display:block; }
      .servers-sidebar { width: 100%; height: 56px; flex-direction: row; position: fixed; bottom: 0; left: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 0 8px; justify-content: space-between; z-index: 50; }
      .server-icon { width: 36px; height: 36px; border-radius: 50%; font-size:14px; margin: 0 2px; box-shadow: none; }
      .server-icon.add-server { border:none; }
      .main-content { height: 100%; padding-bottom: 60px; }
      .login-box { min-width: auto; width: 90%; padding: 24px; }
      .profile-banner { height: 120px; }
      .profile-info-area { margin-top: -40px; }
      .avatar-wrapper { width: 72px; height: 72px; }
      .profile-avatar { font-size: 28px; }
      
      .voice-members { width: 120px; }
      .voice-layout { flex-direction: column; }
      .voice-members { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; padding: 8px; }
      .voice-member-item { width: 45%; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebars()"></div>

<script>
// ===== FIREBASE =====
var firebaseConfig = {
  apiKey: "AIzaSyBrv_u1yq-ncnBlyB1tqlN-eYstQ97dQGk",
  authDomain: "onyx-a631b.firebaseapp.com",
  databaseURL: "https://onyx-a631b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "onyx-a631b",
  storageBucket: "onyx-a631b.firebasestorage.app",
  messagingSenderId: "479145824873",
  appId: "1:479145824873:web:d4ba27fd44b212f6eec8f8"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.database();
var googleProvider = new firebase.auth.GoogleAuthProvider();

// ===== STATE =====
var currentUser = null;
var currentTheme = 'dark';
var unsubscribeChat = null;
var unsubscribeVoiceMembers = null;
var unsubscribeVoiceChat = null;
var isMobile = window.innerWidth <= 768;
var peerConnection = null;
var localStream = null;
var currentCallDocId = null;
var currentChannelId = 'c1'; // Для текстового и голосового

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== MODAL =====
function openModal(title, bodyHTML, onConfirm, confirmText, isDanger) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header"><span>${title}</span><span class="modal-close">✕</span></div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-footer">
        <button class="modal-btn secondary" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
        <button class="modal-btn ${isDanger ? 'danger' : 'primary'}" onclick="(function(){
          var btn = this;
          var result = (${onConfirm.toString()})();
          if(result !== false) btn.closest('.modal-overlay').remove();
        }).call(this)">${confirmText || 'Ок'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-close').onclick = function() { overlay.remove(); };
  overlay.addEventListener('click', function(e) { if(e.target === overlay) overlay.remove(); });
}

// ===== NAV =====
function toggleSidebar(id) {
  var el = document.getElementById(id);
  var overlay = document.getElementById('sidebarOverlay');
  if (el) { el.classList.toggle('open'); overlay.classList.toggle('active'); }
}
function closeSidebars() {
  document.getElementById('channelsSidebar')?.classList.remove('open');
  document.getElementById('friendsSidebar')?.classList.remove('open');
  document.getElementById('sidebarOverlay')?.classList.remove('active');
}

// ===== LOGIN =====
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrapper">
      <div class="login-box">
        <h2>ONYX</h2>
        <p style="color:var(--text-secondary); font-size:14px; text-align:center;">Вход в мессенджер</p>
        <button class="login-btn google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
          Войти через Google
        </button>
        <div class="login-separator">или</div>
        <input id="loginEmail" class="login-input" type="email" placeholder="Email" />
        <input id="loginPassword" class="login-input" type="password" placeholder="Пароль" />
        <div style="display:flex; gap:8px; width:100%;">
          <button class="login-btn secondary" onclick="handleEmailRegister()">Регистрация</button>
          <button class="login-btn primary" onclick="handleEmailLogin()">Войти</button>
        </div>
      </div>
    </div>
  `;
}

function handleEmailRegister() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPassword').value.trim();
  if(!email || !pass) return openModal('Ошибка', 'Заполните все поля');
  auth.createUserWithEmailAndPassword(email, pass)
    .then(function(cred) {
      return db.ref('users/' + cred.user.uid).set({ 
        username: email.split('@')[0], 
        email: email, 
        avatar: '', 
        banner: '', 
        bio: 'Расскажите о себе'
      });
    })
    .catch(function(e) { openModal('Ошибка', e.message); });
}

function handleEmailLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPassword').value.trim();
  if(!email || !pass) return openModal('Ошибка', 'Заполните все поля');
  auth.signInWithEmailAndPassword(email, pass)
    .catch(function(e) { openModal('Ошибка входа', e.message); });
}

function handleGoogleLogin() {
  auth.signInWithPopup(googleProvider)
    .then(function(cred) {
      var user = cred.user;
      return db.ref('users/' + user.uid).set({ 
        username: user.displayName || user.email.split('@')[0], 
        email: user.email, 
        avatar: user.photoURL || '', 
        banner: '', 
        bio: 'Расскажите о себе'
      }, { merge: true });
    })
    .catch(function(e) { openModal('Ошибка', e.message); });
}

// ===== CORE APP =====
function initApp(user) {
  document.body.className = currentTheme;
  var userRef = db.ref('users/' + user.uid);
  userRef.on('value', function(snap) {
    if (snap.exists()) {
      currentUser = snap.val();
      currentUser.id = user.uid;
      renderApp();
    } else {
      db.ref('users/' + user.uid).set({ username: user.email.split('@')[0], email: user.email, avatar: '', banner: '', bio: 'Расскажите о себе' });
    }
  });
}

function renderApp() {
  if (!currentUser) return;
  isMobile = window.innerWidth <= 768;
  
  var html = `
    <div class="servers-sidebar">
      ${isMobile ? `<div class="nav-btn gradient" onclick="toggleSidebar('channelsSidebar')"><svg viewBox="0 0 24 24" fill="#000"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>` : ''}
      <div class="server-icon active" onclick="renderApp()">O</div>
      <div class="server-icon add-server">+</div>
      ${!isMobile ? `<div class="nav-btn" onclick="toggleTheme()" style="margin-top:auto;">${currentTheme === 'dark' ? '☀' : '🌙'}</div>` : ''}
      ${isMobile ? `<div class="nav-btn gradient" onclick="toggleSidebar('friendsSidebar')"><svg viewBox="0 0 24 24" fill="#000"><path d="M4 22a8 8 0 1 1 16 0h-2a6 6 0 1 0-12 0H4zm8-9c-3.315 0-6-2.685-6-6s2.685-6 6-6 6 2.685 6 6-2.685 6-6 6zm0-2c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/></svg></div>` : ''}
      <div class="nav-btn" onclick="handleLogout()" style="background:transparent; color:var(--danger); border:none;"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h6v2H5v14h6v2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm9.293 9l-3.293 3.293 1.414 1.414L17.414 12l-5-5-1.414 1.414L14.293 11H8v2h6.293z"/></svg></div>
    </div>
    
    <div class="channels-sidebar" id="channelsSidebar">
      <div class="server-header"><span>Мой Сервер</span><span style="cursor:pointer;font-size:14px;color:var(--text-secondary);">⚙</span></div>
      <div class="channel-group">Текстовые</div>
      <div class="channel-item active" onclick="switchToTextChat()"><span style="color:var(--text-secondary);">#</span> общий</div>
      <div class="channel-group" style="margin-top:12px;">Голосовые</div>
      <div class="channel-item" onclick="switchToVoiceChat()"><span style="color:var(--text-secondary);">🔊</span> Голосовой</div>
      <div class="user-panel" onclick="renderProfile()">
        <div class="user-avatar">${currentUser.avatar ? `<img src="${currentUser.avatar}" />` : currentUser.username[0].toUpperCase()}</div>
        <div class="user-info"><div class="user-name">${esc(currentUser.username)}</div><div class="user-tag">Профиль</div></div>
      </div>
      ${isMobile ? `<div style="padding:10px;border-top:1px solid var(--border);"><div class="nav-btn" onclick="toggleTheme()" style="width:100%;border-radius:8px;gap:8px;">${currentTheme === 'dark' ? '☀ Светлая тема' : '🌙 Тёмная тема'}</div></div>` : ''}
    </div>
    
    <div class="main-content" id="mainContent"></div>
    
    <div class="friends-sidebar" id="friendsSidebar">
      <div class="friends-header">Друзья <span style="cursor:pointer;font-size:16px;" onclick="showAddFriend()">+</span></div>
      <div class="friend-item" onclick="startCallToFriend()"><div class="friend-avatar">📞</div><div style="font-size:14px;">Позвонить</div></div>
    </div>
  `;
  
  document.getElementById('app').innerHTML = html;
  closeSidebars();
  // По умолчанию загружаем текстовый чат
  renderTextChat();
}

// ===== SWITCH BETWEEN CHATS =====
var currentChatType = 'text'; // 'text' or 'voice'

function switchToTextChat() {
  currentChatType = 'text';
  if (unsubscribeVoiceMembers) unsubscribeVoiceMembers();
  if (unsubscribeVoiceChat) unsubscribeVoiceChat();
  renderTextChat();
}

function switchToVoiceChat() {
  currentChatType = 'voice';
  if (unsubscribeChat) unsubscribeChat();
  renderVoiceChat();
}

// ===== TEXT CHAT =====
function renderTextChat() {
  var main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="chat-header"># общий</div>
    <div class="messages" id="messagesContainer"></div>
    <div class="input-area">
      <input type="file" id="fileInput" accept="image/*" hidden />
      <button class="icon-btn gradient" onclick="document.getElementById('fileInput').click()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg></button>
      <input type="text" id="chatInput" placeholder="Сообщение..." />
      <button class="icon-btn gradient" onclick="sendTextMessage()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  `;

}

function sendTextMessage() {
  var input = document.getElementById('chatInput');
  if (!input || !input.value.trim()) return;
  var text = input.value.trim();
  input.value = '';
  db.ref('messages/general').push({ 
    senderId: currentUser.id, 
    username: currentUser.username, 
    text: text
  });
}

function listenTextMessages() {
  if (unsubscribeChat) unsubscribeChat();
  var container = document.getElementById('messagesContainer');
  if (!container) return;
  
  unsubscribeChat = db.ref('messages/general').limitToLast(50);
  unsubscribeChat.on('child_added', function(snap) {
    var m = snap.val();
    var own = m.senderId === currentUser.id;
    var el = document.createElement('div');
    el.className = 'message' + (own ? ' own' : '');
    el.innerHTML = '<div class="sender">' + esc(m.username) + '</div><div>' + esc(m.text) + '</div>';
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  });
}

// ===== VOICE CHAT (ROOM) =====
function renderVoiceChat() {
  var main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="voice-container">
      <div class="voice-header">
        <span>🔊 Голосовой канал</span>
        <button class="action-btn primary" onclick="enterVoiceRoom()">Войти</button>
        <button class="action-btn" style="color:var(--danger);" onclick="leaveVoiceRoom()">Выйти</button>
      </div>
      <div class="voice-layout">
        <div class="voice-members" id="voiceMembersContainer">
          <div style="color:var(--text-secondary); font-size:14px;">Участники (0)</div>
        </div>
        <div class="voice-chat">
          <div class="messages" id="voiceMessagesContainer"></div>
          <div class="input-area">
            <input type="text" id="voiceChatInput" placeholder="Сообщение в канал..." />
            <button class="icon-btn gradient" onclick="sendVoiceChatMessage()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>

        </div>
      </div>

// --- Voice Room Logic ---
function enterVoiceRoom() {
  if (!currentUser) return;
  var ref = db.ref('voice_rooms/main_channel/members/' + currentUser.id);
  ref.set({ username: currentUser.username, avatar: currentUser.avatar || '' });
  // Гарантируем, что пользователь удалится при обновлении страницы или закрытии вкладки
  ref.onDisconnect().remove();
}

function leaveVoiceRoom() {
  if (!currentUser) return;
  db.ref('voice_rooms/main_channel/members/' + currentUser.id).remove();
}

function listenVoiceMembers() {
  if (unsubscribeVoiceMembers) unsubscribeVoiceMembers();
  var container = document.getElementById('voiceMembersContainer');
  if (!container) return;
  
  var ref = db.ref('voice_rooms/main_channel/members');
  unsubscribeVoiceMembers = ref.on('value', function(snap) {
    var count = 0;
    var html = '<div style="color:var(--text-secondary); font-size:14px; margin-bottom:8px;">Участники:</div>';
    if (snap.exists()) {
      snap.forEach(function(child) {
        count++;
        var data = child.val();
        var uid = child.key;
        var isSelf = uid === currentUser.id;
        html += `
          <div class="voice-member-item">
            <div class="info">
              <span style="width:24px;height:24px;border-radius:50%;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;">${data.username ? data.username[0].toUpperCase() : '?'}</span>
              <span>${esc(data.username)} ${isSelf ? '(Вы)' : ''}</span>
            </div>
            ${!isSelf ? `<button class="action-btn" onclick="startCallToUser('${uid}')">Позвонить</button>` : ''}
          </div>
        `;
      });
    } else {
      html += '<div style="color:var(--text-secondary); font-size:13px; padding:8px 0;">Никого нет в канале</div>';
    }
    container.innerHTML = html + `<div style="margin-top:8px; color:var(--text-secondary); font-size:12px;">Всего: ${count}</div>`;
  });
}

// ===== WEBRTC (P2P CALL) =====
function startCallToUser(uid) {
  if (!uid || uid === currentUser.id) return;
  openModal('Звонок', 'Пытаемся дозвониться до пользователя...');
  // В этом коде реализована логика исходящего звонка. 
  // Для упрощения вызываем WebRTC функцию.
  initiateCall(uid);
}

function startCallToFriend() {
  if (peerConnection) return;
  openModal('Звонок', 'Введите ID пользователя для теста, или выберите друга из списка');
}

// WebRTC Implementation
function initiateCall(targetUid) {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    localStream = stream;
    peerConnection = new RTCPeerConnection({ 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] });
    localStream.getTracks().forEach(function(track) { peerConnection.addTrack(track, localStream); });

    var callRef = db.ref('calls/' + Date.now());
    currentCallDocId = callRef.key;
    var iceCandidatesRef = callRef.child('ice');

    peerConnection.onicecandidate = function(event) {
      if (event.candidate) iceCandidatesRef.push(event.candidate.toJSON());
    };
    peerConnection.ontrack = function(event) {
      var audioEl = document.getElementById('remoteAudio');
      if (audioEl) audioEl.srcObject = event.streams[0];
    };

    peerConnection.createOffer().then(function(offer) {
      return peerConnection.setLocalDescription(offer).then(function() {
        return callRef.set({ 
          offer: { type: offer.type, sdp: offer.sdp }, 
          callerId: currentUser.id, 
          targetId: targetUid,
          status: 'ringing' 
        });
      });
    });

    callRef.on('value', function(snap) {
      var data = snap.val();
      if (data && data.answer && !peerConnection.currentRemoteDescription) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
      if (data && data.status === 'ended') endCall();
    });
    iceCandidatesRef.on('child_added', function(snap) {
      peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
    });

    document.getElementById('mainContent').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px;background:var(--bg);">
        <div style="font-weight:600;font-size:20px;">📞 Активный звонок</div>
        <div style="padding:16px 32px;background:var(--surface-secondary);border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;gap:16px;">
          <div style="width:12px;height:12px;border-radius:50%;background:#3ba55c;"></div>
          <div><div>Подключено</div><div style="font-size:12px;color:var(--text-secondary);">Микрофон активен</div></div>
        </div>
        <div style="display:flex;gap:12px;">
          <button class="icon-btn gradient" onclick="toggleMic()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg></button>
          <button class="icon-btn" style="background:var(--danger);color:#fff;border:none;" onclick="endCall()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></button>
        </div>
        <audio id="remoteAudio" autoplay></audio>
      </div>
    `;
  }).catch(function() { openModal('Ошибка', 'Нет доступа к микрофону'); });
}

function endCall() {
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; }
  if (currentCallDocId) db.ref('calls/' + currentCallDocId).update({ status: 'ended' });
  currentCallDocId = null;
  renderApp();
}
function toggleMic() { if (localStream) localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; }

// ===== PROFILE =====
function renderProfile() {
  var main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="profile-view">
      <div class="profile-banner" onclick="document.getElementById('bannerInput').click()">
        ${currentUser.banner ? `<img src="${currentUser.banner}" />` : '<div style="display:flex;align-items:center;justify-content:center;color:var(--text-secondary);">Нажмите, чтобы добавить баннер</div>'}
        <button class="banner-overlay">Заменить баннер</button>

      </div>

          <div class="avatar-overlay"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>

        <div class="profile-actions">

          <button class="action-btn" onclick="editUsername()">Сменить ник</button>
        </div>
      </div>

  `;
}

function compressImage(file, maxSizeKB, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var MAX_WIDTH = 400;
      var MAX_HEIGHT = 400;
      var width = img.width;
      var height = img.height;

      if (width > height) {
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
      } else {
        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
      }
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      var quality = 0.7;
      var dataUrl = canvas.toDataURL('image/jpeg', quality);
      while (dataUrl.length > maxSizeKB * 1024 && quality > 0.1) {
        quality -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function updateFile(type, event) {
  var file = event.target.files[0];
  if (!file) return;
  compressImage(file, 150, function(base64) {
    var upd = {}; 
    upd[type] = base64;
    db.ref('users/' + currentUser.id).update(upd).then(function() {
      event.target.value = '';
    }).catch(function(e) {
      openModal('Ошибка загрузки', 'Не удалось сохранить изображение: ' + e.message);
    });
  });
}

function editBio() {
  openModal('Изменить био', `<input id="newBio" class="modal-input" value="${esc(currentUser.bio)}" />`, function() {
    var bio = document.getElementById('newBio').value.trim();
    if(bio !== currentUser.bio) db.ref('users/' + currentUser.id).update({ bio: bio });
  });
}

function editUsername() {
  openModal('Сменить никнейм', `<input id="newUsername" class="modal-input" value="${esc(currentUser.username)}" placeholder="Новый ник" />`, function() {
    var name = document.getElementById('newUsername').value.trim();
    if(name && name !== currentUser.username) db.ref('users/' + currentUser.id).update({ username: name });
  });
}

// ===== FRIENDS =====
function showAddFriend() {
  openModal('Добавить друга', `
    <p style="color:var(--text-secondary);font-size:14px;">Введите точный никнейм.</p>
    <input id="friendSearchInput" class="modal-input" placeholder="Никнейм..." />
  `, function() {
    var username = document.getElementById('friendSearchInput').value.trim();
    if(!username) return false;
    db.ref('users').orderByChild('username').equalTo(username).once('value', function(snap) {
      var found = false;
      snap.forEach(function(child) {
        var targetId = child.key;
        var targetData = child.val();
        if(targetId !== currentUser.id) {
          db.ref('users/' + currentUser.id + '/friends/' + targetId).set({
            username: targetData.username,
            avatar: targetData.avatar || ''
          });
          found = true;
          openModal('Готово', 'Пользователь ' + targetData.username + ' добавлен в друзья!');
        }
      });
      if(!found) openModal('Не найдено', 'Пользователь не найден, или это вы сами.');
    }).catch(function(e) {
      openModal('Ошибка поиска', 'Ошибка базы данных: ' + e.message);
    });
  });
}

// ===== THEME & LOGOUT =====
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.body.className = currentTheme;
  renderApp();
}
function handleLogout() { auth.signOut(); }

// ===== BOOT =====
auth.onAuthStateChanged(function(user) {
  if (user) initApp(user);
  else renderLogin();
});
